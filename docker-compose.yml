# Despliegue conjunto de la API y el tablero (local o en una instancia EC2).
#   docker compose up -d --build
# API: http://<host>:8001/docs   Tablero: http://<host>:8050
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: api-rendimiento
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  tablero:
    build:
      context: ./tablero
    image: tablero-rendimiento
    ports:
      - "8050:8050"
    environment:
      API_URL: http://api:8001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
